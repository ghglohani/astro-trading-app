name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev python3-dev autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libreadline-dev libgdbm-dev libsqlite3-dev libdb5.3-dev libbz2-dev libexpat1-dev liblzma-dev tk-dev unzip zip openjdk-17-jdk

    - name: Set up Android NDK Environment
      run: |
        echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV
        echo "ANDROID_NDK_PATH=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

    - name: Install Buildozer and Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "cython<3.0.0" buildozer setuptools

    - name: Create Custom Recipe for pyswisseph
      run: |
        mkdir -p p4a_recipes/pyswisseph
        cat << 'EOF' > p4a_recipes/pyswisseph/__init__.py
from pythonforandroid.recipe import CompiledComponentsPythonRecipe

class PySwissephRecipe(CompiledComponentsPythonRecipe):
    version = '2.10.0.2'
    url = 'https://files.pythonhosted.org/packages/source/p/pyswisseph/pyswisseph-{version}.tar.gz'
    depends = ['python3']
    site_packages_name = 'swisseph'

recipe = PySwissephRecipe()
EOF

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AstroTrading-APK
        path: bin/*.apk
