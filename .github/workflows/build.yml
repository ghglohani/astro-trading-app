name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install System Dependencies & AIDL
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev aidl
        pip install --upgrade pip
        pip install "buildozer>=1.5.0" cython

    - name: Auto Accept Android SDK Licenses
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        
        # Path resolve support for Android SDK
        SDK_PATH="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
        
        if [ -d "$SDK_PATH/cmdline-tools/latest/bin" ]; then
          yes | $SDK_PATH/cmdline-tools/latest/bin/sdkmanager --licenses || true
        elif [ -d "$SDK_PATH/tools/bin" ]; then
          yes | $SDK_PATH/tools/bin/sdkmanager --licenses || true
        fi

    - name: Build APK with Buildozer
      run: |
        # Buildozer commands with auto-yes for licenses
        yes | buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AstroTrading-APK
        path: bin/*.apk
